name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PNPM_VERSION: 12.15.0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tag_version="${RELEASE_TAG#v}"
          test "$tag_version" = "$package_version" || {
            echo "Tag $RELEASE_TAG does not match package.json version $package_version" >&2
            exit 1
          }
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Validate documentation and generated API docs
        run: pnpm run docs:check
      - name: Inspect package tarball
        run: pnpm run pack:dry-run

  compatibility:
    name: compatibility (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test and build
        run: pnpm test

  publish:
    name: publish to npm
    needs: [verify, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check npm version availability
        id: npm-version
        run: |
          package_name="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published; skipping duplicate publication."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm trusted publishing and provenance
        if: steps.npm-version.outputs.already_published != 'true'
        run: npm publish --provenance --access public
